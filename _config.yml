# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Theme settings
theme: jekyll-theme-hacker

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.title }}, etc.

title: WebRTC A/V Sync Deep Dive
description: Detailed explanation of Audio/Video synchronization mechanisms in WebRTC.
# email: your-email@example.com # Optional

# Base URL and URL settings for GitHub Pages
# baseurl is the subpath of your site, e.g. /blog. For a project site at the root of username.github.io/project-name,
# it should be "/project-name". For a user site username.github.io, it should be "".
# Since this project appears to be intended as a project page (given the URL structure),
# and assuming the repository name will be part of the path,
# baseurl should ideally be "/<repository-name>".
# However, the prompt explicitly asks for baseurl: "" and url: "https://asplingzhang.github.io".
# This configuration (empty baseurl and root URL) is typical for a user/organization site (e.g., asplingzhang.github.io itself),
# NOT for a project site (asplingzhang.github.io/repository-name).
# If this IS a project site, and the repo name is e.g. "webrtc-av-sync-docs", then baseurl should be "/webrtc-av-sync-docs".
# I will follow the prompt's explicit instructions but note this potential discrepancy for project sites.
# For a user page (like asplingzhang.github.io), baseurl: "" is correct.
baseurl: ""
url: "https://asplingzhang.github.io"

# Build settings
# markdown: kramdown # Default markdown processor

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata # Good for GitHub Pages integration
